name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      
      - name: install pnpn
        run: npm install -g pnpm@latest-11

      - name: Install dependencies
        run: pnpm ci
    
      - name: Run unit test
        run : pnpm run test